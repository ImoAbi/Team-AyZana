<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-AyZana - Registrierung</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        // Debugging
        window.onload = function() {
            console.log('EmailJS geladen:', typeof emailjs !== 'undefined');
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TEAM-AYZANA</h1>
            <p>Ihr persönlicher Medikamenten-Manager</p>
        </header>

        <main>
            <section class="register-section">
                <h2>REGISTRIERUNG</h2>
                <div id="verification-message" style="display: none;" class="verification-message">
                    <p>BITTE ÜBERPRÜFEN SIE IHRE E-MAIL, UM IHRE REGISTRIERUNG ZU BESTÄTIGEN.</p>
                </div>
                <form id="register-form">
                    <div class="form-group">
                        <label for="name">VOR- UND NACHNAME:</label>
                        <input type="text" id="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-MAIL:</label>
                        <input type="email" id="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">PASSWORT:</label>
                        <div class="password-container">
                            <input type="password" id="password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">PASSWORT BESTÄTIGEN:</label>
                        <div class="password-container">
                            <input type="password" id="confirm-password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">
                                <span class="eye-icon">👁️</span>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="register-button">REGISTRIEREN</button>
                </form>
                
                <p class="login-link">Bereits registriert? <a href="login.html">Anmelden</a></p>
            </section>
        </main>
    </div>
    <script src="auth.js"></script>
</body>
</html>
